apis:
  - aid: degreed:degreed-api
    name: Degreed API
    description: >-
      The Degreed REST API provides HTTP-based access to manage learning data
      within the Degreed platform. It covers user management, learning content
      (articles, books, courses, videos, podcasts, events), pathways, skill
      tracking, completions, accomplishments, groups, required and recommended
      learning, and xAPI statement ingestion. Authentication uses OAuth 2.0
      Client Credentials Flow.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg

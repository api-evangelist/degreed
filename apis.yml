aid: degreed
name: Degreed
description: >-
  Degreed is a learning experience platform with a REST API for managing
  learning pathways, tracking skill development, accessing content integrations,
  and reporting workforce upskilling data. The API enables organizations to
  manage users, content, completions, skills, pathways, accomplishments, and
  social learning features using OAuth 2.0 authentication. Multi-region
  deployments are supported across US, EU, and Canada data centers.
